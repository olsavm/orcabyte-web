<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges" role="img" aria-label="Orcabyte pixel-art orca logo">
  <!-- ocean background tile -->
  <rect x="0" y="0" width="16" height="16" fill="#0e5c8a" />

  <!-- dorsal fin -->
  <rect x="7" y="2" width="2" height="1" fill="#0b1320" />
  <rect x="6" y="3" width="4" height="1" fill="#0b1320" />

  <!-- back / head silhouette -->
  <rect x="5" y="4" width="6" height="1" fill="#0b1320" />
  <rect x="4" y="5" width="9" height="1" fill="#0b1320" />
  <rect x="3" y="6" width="11" height="1" fill="#0b1320" />

  <!-- head front + white eye patch + back -->
  <rect x="2" y="7" width="2" height="1" fill="#0b1320" />
  <rect x="4" y="7" width="2" height="1" fill="#ffffff" />
  <rect x="6" y="7" width="8" height="1" fill="#0b1320" />

  <rect x="2" y="8" width="2" height="1" fill="#0b1320" />
  <rect x="4" y="8" width="1" height="1" fill="#ffffff" />
  <rect x="5" y="8" width="10" height="1" fill="#0b1320" />

  <!-- widest part of back, tapering toward tail -->
  <rect x="1" y="9" width="14" height="1" fill="#0b1320" />
  <rect x="2" y="10" width="12" height="1" fill="#0b1320" />

  <!-- white belly -->
  <rect x="3" y="11" width="10" height="1" fill="#ffffff" />
  <rect x="4" y="12" width="8" height="1" fill="#ffffff" />

  <!-- tail underside -->
  <rect x="5" y="13" width="6" height="1" fill="#0b1320" />
</svg>
